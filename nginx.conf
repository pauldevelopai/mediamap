events {
    worker_connections 1024;
}

http {
    upstream mediamap {
        server mediamap:8000;
    }

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    server {
        listen 80;
        server_name www.developai.co.za developai.co.za;

        # Main site (if you have other content)
        location / {
            # You can either redirect to /mediamap or serve your main site
            return 301 /mediamap;
            
            # OR if you have a main site:
            # proxy_pass http://your-main-site;
        }

        # MediaMap application
        location /mediamap {
            proxy_pass http://localhost:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /mediamap;
            
            # Handle static files
            location /mediamap/static/ {
                proxy_pass http://localhost:8000/static/;
            }
        }

        # Health check
        location /health {
            proxy_pass http://localhost:8000/health;
            access_log off;
        }
    }
} 