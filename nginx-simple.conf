events {
    worker_connections 1024;
}

http {
    upstream mediamap {
        server mediamap:8000;
    }

    server {
        listen 80;
        server_name _;

        location / {
            proxy_pass http://mediamap:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check
        location /health {
            proxy_pass http://mediamap:8000/health;
            access_log off;
        }
    }
} 