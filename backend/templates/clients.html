<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clients - DataSafe AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #f5f7fb; }
        .header { background: rgba(255,255,255,0.95); border-bottom: 1px solid #e5e7eb; padding: 1rem 0; position: sticky; top: 0; z-index: 100; }
        .header-content { display:flex; justify-content:space-between; align-items:center; max-width: 1200px; margin: 0 auto; padding: 0 1.5rem; }
        .brand { font-weight: 700; color: #6366f1; text-decoration:none; display:flex; align-items:center; gap:.5rem; }
        .username { color:#1f2937; font-weight:600; background:#fff; padding:8px 16px; border-radius:20px; border:1px solid #e5e7eb; }
        .user-actions { display:flex; gap:.75rem; align-items:center; }
        .btn-secondary { background:#f3f4f6; color:#374151; border:1px solid #e5e7eb; padding:.5rem .9rem; border-radius:8px; text-decoration:none; display:inline-flex; align-items:center; gap:.5rem; }
        .btn-secondary:hover { background:#e5e7eb; color:#111827; }
        .main-container { max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem; }
        .page-title { font-weight:700; color:#111827; margin-bottom: .5rem; }
        .sub { color:#6b7280; }
        .card { border:1px solid #e5e7eb; border-radius:12px; box-shadow: 0 2px 8px rgba(0,0,0,.04); }
        .client-card { transition: transform .15s ease, box-shadow .15s ease; }
        .client-card:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,.08); }
    </style>
    </head>
<body>
    <header class="header">
        <div class="header-content">
            <a href="{{ url_for('user_dashboard') }}" class="brand">
                <i class="bi bi-robot"></i>
                DataSafe AI
            </a>
            <div class="user-info">
                <span class="username"><i class="bi bi-person-circle me-1"></i>{{ current_user.username }}</span>
            </div>
            <div class="user-actions">
                <a href="{{ url_for('my_chats') }}" class="btn-secondary"><i class="bi bi-chat-text"></i> My Chats</a>
                <a href="{{ url_for('company_info') }}" class="btn-secondary"><i class="bi bi-building"></i> Company Info</a>
                <a href="{{ url_for('ai_strategies') }}" class="btn-secondary"><i class="bi bi-lightbulb"></i> AI Strategies</a>
                <a href="{{ url_for('clients.clients_index') }}" class="btn-secondary"><i class="bi bi-people"></i> Clients</a>
                <a href="{{ url_for('today_news') }}" class="btn-secondary"><i class="bi bi-newspaper"></i> Today's News</a>
                <a href="{{ url_for('logout') }}" class="btn-secondary"><i class="bi bi-box-arrow-right"></i> Logout</a>
            </div>
        </div>
    </header>

    <div class="main-container">
        <div class="mb-4">
            <h1 class="page-title"><i class="bi bi-people me-2"></i>Clients</h1>
            <div class="sub">Select a client to open their dashboard.</div>
        </div>

        <div class="row g-3">
            {% for c in clients %}
            <div class="col-12 col-md-6 col-lg-4">
                <a class="text-decoration-none" href="{{ url_for('clients.client_dashboard', client_slug=c.slug if c.slug is defined else c['slug']) }}">
                    <div class="card client-card h-100">
                        <div class="card-body d-flex align-items-center justify-content-between">
                            <div>
                                <div class="fw-semibold text-dark">{{ c.name if c.name is defined else c['name'] }}</div>
                                <div class="text-muted small">Dashboard</div>
                            </div>
                            <i class="bi bi-arrow-right-circle fs-4 text-primary"></i>
                        </div>
                    </div>
                </a>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
