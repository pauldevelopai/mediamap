{% extends "admin/base_admin.html" %}

{% block title %}New Plan - Admin{% endblock %}

{% block header %}Create Implementation Plan{% endblock %}

{% block content %}
<form method="post">
  <div class="mb-3">
    <label class="form-label">Title</label>
    <input type="text" class="form-control" name="title" placeholder="e.g., Ethics-first AI rollout Q3" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Summary / Context</label>
    <textarea class="form-control" name="summary" rows="5" placeholder="Brief context and goals"></textarea>
  </div>
  <div class="d-flex gap-2">
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{{ url_for('admin_plans') }}" class="btn btn-secondary">Cancel</a>
  </div>
</form>
{% endblock %}
