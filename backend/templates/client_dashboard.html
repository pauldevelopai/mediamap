<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ client.name }} - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
    <style>
        body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #f9fafb; }
        .header { background:#fff; border-bottom:1px solid #e5e7eb; padding: .75rem 0; position: sticky; top: 0; z-index: 100; }
        .header-content { display:flex; justify-content:space-between; align-items:center; max-width: 1200px; margin: 0 auto; padding: 0 1.5rem; }
        .brand { font-weight: 700; color: #6366f1; text-decoration:none; display:flex; align-items:center; gap:.5rem; }
        .username { color:#1f2937; font-weight:600; background:#fff; padding:8px 16px; border-radius:20px; border:1px solid #e5e7eb; }
        .btn-secondary { background:#f3f4f6; color:#374151; border:1px solid #e5e7eb; padding:.5rem .9rem; border-radius:8px; text-decoration:none; display:inline-flex; align-items:center; gap:.5rem; }
        .btn-secondary:hover { background:#e5e7eb; color:#111827; }
        .main-container { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }
        .section-card { border:1px solid #e5e7eb; border-radius:12px; background:#fff; box-shadow: 0 2px 8px rgba(0,0,0,.04); }
        .section-title { font-weight:600; }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <a href="{{ url_for('clients.clients_index') }}" class="brand">
                <i class="bi bi-people"></i>
                Clients
            </a>
            <div class="user-info">
                <span class="username"><i class="bi bi-person-circle me-1"></i>{{ current_user.username }}</span>
            </div>
            <div class="user-actions">
                <a href="{{ url_for('my_chats') }}" class="btn-secondary"><i class="bi bi-chat-text"></i> My Chats</a>
                <a href="{{ url_for('company_info') }}" class="btn-secondary"><i class="bi bi-building"></i> Company Info</a>
                <a href="{{ url_for('ai_strategies') }}" class="btn-secondary"><i class="bi bi-lightbulb"></i> AI Strategies</a>
                <a href="{{ url_for('today_news') }}" class="btn-secondary"><i class="bi bi-newspaper"></i> Today's News</a>
                <a href="{{ url_for('logout') }}" class="btn-secondary"><i class="bi bi-box-arrow-right"></i> Logout</a>
            </div>
        </div>
    </header>

    <div class="main-container">
        <div class="d-flex align-items-center justify-content-between mb-3">
            <h1 class="h4 m-0"><i class="bi bi-kanban me-2"></i>{{ client.name }} Dashboard</h1>
            <a href="{{ url_for('ims.index_ims') if client.slug == 'ims' else '#' }}" class="btn btn-primary btn-sm">
                <i class="bi bi-box-arrow-up-right"></i> Open Tools
            </a>
        </div>

        <div class="row g-3">
            <div class="col-12 col-lg-6">
                <div class="section-card p-3 h-100">
                    <div class="d-flex align-items-center justify-content-between mb-2">
                        <div class="section-title"><i class="bi bi-bullseye me-1"></i> Strategy Goals</div>
                        <a class="small" href="#">Manage</a>
                    </div>
                    <div class="text-muted small">Link goals, problems, and AI implementations. Export to Excel.</div>
                </div>
            </div>
            <div class="col-12 col-lg-6">
                <div class="section-card p-3 h-100">
                    <div class="d-flex align-items-center justify-content-between mb-2">
                        <div class="section-title"><i class="bi bi-graph-up-arrow me-1"></i> Implementation Success</div>
                        <a class="small" href="#">Assess</a>
                    </div>
                    <div class="text-muted small">Impact assessment using established frameworks.</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
